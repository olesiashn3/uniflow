# CI: тести, покриття (XML + HTML), артефакти, SonarCloud.
# Після створення проєкту в SonarCloud відредагуйте sonar-project.properties
# (sonar.organization, sonar.projectKey) і додайте репозиторій у SonarCloud.
# У GitHub: Settings → Secrets → Actions → SONAR_TOKEN.

name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=html

      - name: Fix coverage.xml paths for SonarCloud
        run: |
          sed -i 's@/home/runner/work/uniflow/uniflow@/github/workspace@g' coverage.xml

      - name: Upload coverage artifacts (HTML + XML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
